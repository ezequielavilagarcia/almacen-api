services:
  store-api:
    image: node:lts-alpine
    container_name: store-api
    working_dir: /app
    command: sh -c "yarn install && npx prisma generate && yarn start:dev"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@store-postgres:5432/store?schema=public
    depends_on:
      - store-postgres
    env_file:
      - .env
    networks:
      - store-network

  store-postgres:
    image: postgres:15-alpine
    container_name: store-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - store-network

  store-pgadmin:
    image: dpage/pgadmin4
    container_name: store-pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - store-postgres
    networks:
      - store-network

networks:
  store-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
